<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0906" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="খেরোর খাতা" />
  <title>গল্পবলিয়ের খেরোর খাতা</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:      #0B0906;
      --surface: #110E0B;
      --card:    #161210;
      --cardHov: #1C1815;
      --border:  #2A2218;
      --gold:    #C9A84C;
      --text:    #E8DBC0;
      --muted:   #6B5E48;
      --dim:     #3A3028;
      --accent:  #4A8F7B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* Grainy noise texture from your reference */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    #root {
      position: relative; z-index: 1; max-width: 900px; margin: 0 auto;
      padding: 28px 16px env(safe-area-inset-bottom, 80px);
    }

    header { text-align: center; margin-bottom: 28px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    .header-eyebrow { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.4em; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(24px, 6vw, 36px); color: var(--gold); letter-spacing: -0.01em; margin-bottom: 18px; }

    /* Stats Section */
    .stats-row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
    .stat-item { text-align: center; }
    .stat-val { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold); font-weight: 700; line-height: 1; }
    .stat-label { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 4px; }

    /* Shelf Layout */
    .shelf-container { margin-bottom: 40px; }
    .shelf-title { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
    .shelf-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .project-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 18px; cursor: pointer; transition: all 0.2s; position: relative;
    }
    .project-card:hover { border-color: var(--gold); background: var(--cardHov); }
    .project-card h3 { font-family: 'Playfair Display', serif; font-size: 19px; color: var(--text); margin-bottom: 8px; }
    .card-meta { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--dim); text-transform: uppercase; display: flex; justify-content: space-between; }

    /* Editor View */
    .editor-view { animation: fadeIn 0.3s ease; }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .editor-back { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; padding: 6px 12px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 10px; }
    .editor-title-input { background: none; border: none; color: var(--gold); font-family: 'Playfair Display', serif; font-size: 24px; outline: none; width: 70%; }
    
    .editor-main { display: grid; grid-template-columns: 1fr 300px; gap: 24px; }
    @media (max-width: 768px) { .editor-main { grid-template-columns: 1fr; } }
    
    .text-area {
      width: 100%; height: 60vh; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 20px; font-family: 'EB Garamond', serif;
      font-size: 18px; line-height: 1.8; resize: none; outline: none;
    }
    .text-area:focus { border-color: var(--gold); }

    .sidebar-panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .sidebar-title { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 14px; }

    /* PWA Banner */
    #install-banner {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
      border-top: 1px solid var(--border); padding: 12px 18px; display: flex;
      align-items: center; justify-content: space-between; z-index: 1000;
    }

    .btn-gold { background: var(--gold); color: var(--bg); border: none; padding: 8px 16px; border-radius: 5px; font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700; cursor: pointer; }
    .btn-outline { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 5px; font-family: 'Space Mono', monospace; font-size: 10px; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
  // --- PWA ASSETS ---
  (function() {
    const manifest = {
      name: "গল্পবলিয়ের খেরোর খাতা",
      short_name: "খেরোর খাতা",
      start_url: "./",
      display: "standalone",
      background_color: "#0B0906",
      theme_color: "#0B0906",
      icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'><rect width='512' height='512' fill='%230B0906'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='220' fill='%23C9A84C'>গ</text></svg>", sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  })();

  // --- STATE MANAGEMENT ---
  const SHELVES = ["Audiobook Scripts", "Novels", "Video Scripts", "Shorts"];
  let state = {
    projects: JSON.parse(localStorage.getItem('khata_db')) || [],
    view: 'dashboard', // 'dashboard' or 'editor'
    activeId: null,
    deferredPrompt: null,
    showInstall: false
  };

  function save() {
    localStorage.setItem('khata_db', JSON.stringify(state.projects));
    render();
  }

  function createProject() {
    const title = prompt("Manuscript Title:") || "Untitled";
    const type = prompt("Type (1:Audiobook, 2:Novel, 3:Video, 4:Shorts):") || "1";
    const newProj = {
      id: Date.now(),
      title,
      type: SHELVES[parseInt(type)-1] || SHELVES[0],
      content: "",
      tasks: [],
      updated: new Date().toISOString()
    };
    state.projects.unshift(newProj);
    state.activeId = newProj.id;
    state.view = 'editor';
    save();
  }

  // --- RENDERING ENGINE (Using your el/div helper style) ---
  function el(tag, attrs={}, ...children) {
    const e = document.createElement(tag);
    Object.entries(attrs).forEach(([k,v]) => {
      if(k==="class") e.className=v;
      else if(k.startsWith("on")) e[k.toLowerCase()]=v;
      else e.setAttribute(k,v);
    });
    children.forEach(c => {
      if(c) e.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
    });
    return e;
  }
  function div(attrs,...c) { return el("div",attrs,...c); }
  function btn(attrs,...c) { return el("button",attrs,...c); }

  function render() {
    const root = document.getElementById("root");
    root.innerHTML = "";

    if (state.view === 'dashboard') {
      root.appendChild(renderHeader());
      root.appendChild(renderDashboard());
    } else {
      root.appendChild(renderEditor());
    }

    if (state.showInstall && state.deferredPrompt) {
      root.appendChild(renderInstallBanner());
    }
  }

  function renderHeader() {
    const totalWords = state.projects.reduce((a,p) => a + (p.content.split(/\s+/).length), 0);
    return el("header", {},
      div({class:"header-eyebrow"}, "Manuscript Journal · গল্পবলিয়ের খেরোর খাতা"),
      el("h1", {}, "গল্পবলিয়ের খেরোর খাতা"),
      div({class:"stats-row"},
        div({class:"stat-item"}, div({class:"stat-val"}, state.projects.length), div({class:"stat-label"}, "Projects")),
        div({class:"stat-item"}, div({class:"stat-val"}, totalWords), div({class:"stat-label"}, "Total Words"))
      ),
      div({style:"display:flex; gap:10px; justify-content:center; margin-top:10px;"},
        btn({class:"btn-gold", onclick: createProject}, "+ NEW ENTRY"),
        btn({class:"btn-outline", onclick: exportJSON}, "BACKUP")
      )
    );
  }

  function renderDashboard() {
    const container = div({class:"dashboard-view"});
    SHELVES.forEach(shelf => {
      const projs = state.projects.filter(p => p.type === shelf);
      if (projs.length === 0) return;

      container.appendChild(div({class:"shelf-title"}, shelf));
      const grid = div({class:"project-grid"});
      projs.forEach(p => {
        const card = div({class:"project-card", onclick: () => { state.view='editor'; state.activeId=p.id; render(); }},
          el("h3", {}, p.title),
          div({class:"card-meta"}, 
            el("span", {}, `${p.content.split(/\s+/).length} Words`),
            el("span", {}, new Date(p.updated).toLocaleDateString())
          )
        );
        grid.appendChild(card);
      });
      container.appendChild(grid);
    });
    return container;
  }

  function renderEditor() {
    const proj = state.projects.find(p => p.id === state.activeId);
    return div({class:"editor-view"},
      div({class:"editor-header"},
        btn({class:"editor-back", onclick: () => { state.view='dashboard'; render(); }}, "← DASHBOARD"),
        el("input", {class:"editor-title-input", value: proj.title, oninput: (e) => { proj.title=e.target.value; autoSave(); }}),
        btn({class:"btn-outline", style:"color:#ff4444; border-color:#442222", onclick: deleteActive}, "DELETE")
      ),
      div({class:"editor-main"},
        el("textarea", {
          class:"text-area", 
          placeholder:"The ink awaits...",
          oninput: (e) => { proj.content=e.target.value; proj.updated=new Date().toISOString(); autoSave(); }
        }, proj.content),
        div({class:"sidebar-panel"},
          div({class:"sidebar-title"}, "Assistant Tools"),
          btn({class:"btn-outline", style:"width:100%; margin-bottom:10px", onclick: () => alert("Memory Mode: Project Only")}, "Memory: Project"),
          div({class:"sidebar-title", style:"margin-top:20px"}, "Project Tasks"),
          div({style:"font-size:11px; color:var(--dim); font-style:italic"}, "Task system placeholder...")
        )
      )
    );
  }

  function renderInstallBanner() {
    return div({id:"install-banner"},
      div({style:"font-family:Space Mono; font-size:10px; color:var(--gold)"}, "INSTALL KHEROR KHATA TO MOBILE"),
      div({style:"display:flex; gap:8px"},
        btn({class:"btn-gold", onclick: triggerInstall}, "INSTALL"),
        btn({class:"btn-outline", onclick: () => { state.showInstall=false; render(); }}, "LATER")
      )
    );
  }

  // --- UTILS ---
  let timeout;
  function autoSave() {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      localStorage.setItem('khata_db', JSON.stringify(state.projects));
      console.log("Auto-saved.");
    }, 1000);
  }

  function exportJSON() {
    const data = JSON.stringify(state.projects);
    const blob = new Blob([data], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = el("a", {href: url, download: `Khata_Backup_${new Date().toISOString().split('T')[0]}.json`});
    a.click();
  }

  function deleteActive() {
    if(!confirm("Destroy this manuscript forever?")) return;
    state.projects = state.projects.filter(p => p.id !== state.activeId);
    state.view = 'dashboard';
    save();
  }

  // --- PWA LOGIC ---
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    state.deferredPrompt = e;
    state.showInstall = true;
    render();
  });

  function triggerInstall() {
    if(state.deferredPrompt) {
      state.deferredPrompt.prompt();
      state.deferredPrompt.userChoice.then(() => {
        state.deferredPrompt = null;
        state.showInstall = false;
        render();
      });
    }
  }

  // BOOT
  render();
  </script>
</body>
</html>
  <header>
    <div class="eyebrow">Manuscript Journal · গল্পবলিয়ের খেরোর খাতা</div>
    <h1 id="journal-name">খেরোর খাতা</h1>
    <div class="stats">
      <div class="stat-box"><div class="stat-val" id="stat-projects">0</div><div class="stat-lbl">Projects</div></div>
      <div class="stat-box"><div class="stat-val" id="stat-words">0</div><div class="stat-lbl">Words</div></div>
    </div>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
      <button class="btn" onclick="exportData()">Backup</button>
      <label class="btn">Restore <input type="file" id="importFile" hidden onchange="importData(event)"></label>
    </div>
  </header>

  <div id="shelves-container"></div>
</div>

<div class="fab" onclick="createNewProject()">+</div>

<div id="editor" class="slide-up">
  <div class="editor-header">
    <input type="text" id="edit-title" class="editor-title" />
    <button class="btn" onclick="closeEditor()">Close</button>
  </div>
  <textarea id="edit-content" placeholder="Write your heart out..."></textarea>
  <div class="editor-header" style="border:none; margin:0; padding:10px 0;">
    <div id="word-count" class="stat-lbl">0 words</div>
    <div id="save-indicator" class="stat-lbl" style="color:var(--accent)">✓ Saved</div>
  </div>
</div>

<script>
  // --- CONFIG & STATE ---
  const SHELVES = ["Audiobook Scripts", "Novels", "Video Scripts", "Shorts"];
  let state = {
    projects: JSON.parse(localStorage.getItem('kheror_khata_db')) || [],
    activeId: null
  };

  // --- CORE LOGIC ---
  function saveToDisk() {
    localStorage.setItem('kheror_khata_db', JSON.stringify(state.projects));
    updateStats();
  }

  function updateStats() {
    document.getElementById('stat-projects').innerText = state.projects.length;
    let totalWords = state.projects.reduce((acc, p) => acc + (p.content ? p.content.split(/\s+/).length : 0), 0);
    document.getElementById('stat-words').innerText = totalWords;
  }

  function createNewProject() {
    const type = prompt("Select Type: 1: Audiobook, 2: Novel, 3: Video, 4: Shorts") || "1";
    const title = prompt("Enter Title:") || "Untitled Manuscript";
    const newProj = {
      id: Date.now(),
      title: title,
      type: SHELVES[parseInt(type) - 1] || SHELVES[0],
      content: "",
      updatedAt: new Date().toISOString()
    };
    state.projects.unshift(newProj);
    saveToDisk();
    renderShelves();
    openEditor(newProj.id);
  }

  function openEditor(id) {
    state.activeId = id;
    const proj = state.projects.find(p => p.id === id);
    document.getElementById('edit-title').value = proj.title;
    document.getElementById('edit-content').value = proj.content;
    document.getElementById('editor').style.display = 'flex';
    updateWordCount();
  }

  function closeEditor() {
    document.getElementById('editor').style.display = 'none';
    state.activeId = null;
    renderShelves();
  }

  function handleInput() {
    if (!state.activeId) return;
    const proj = state.projects.find(p => p.id === state.activeId);
    proj.title = document.getElementById('edit-title').value;
    proj.content = document.getElementById('edit-content').value;
    proj.updatedAt = new Date().toISOString();
    
    document.getElementById('save-indicator').innerText = "Saving...";
    updateWordCount();
    
    clearTimeout(window.saveTimer);
    window.saveTimer = setTimeout(() => {
      saveToDisk();
      document.getElementById('save-indicator').innerText = "✓ Saved";
    }, 8000);
  }

  function updateWordCount() {
    const text = document.getElementById('edit-content').value.trim();
    const count = text ? text.split(/\s+/).length : 0;
    document.getElementById('word-count').innerText = count + " words";
  }

  // --- RENDER ---
  function renderShelves() {
    const container = document.getElementById('shelves-container');
    container.innerHTML = "";
    
    SHELVES.forEach(shelf => {
      const filtered = state.projects.filter(p => p.type === shelf);
      if (filtered.length === 0) return;

      const section = document.createElement('div');
      section.innerHTML = `<div class="shelf-title">${shelf}</div>`;
      const grid = document.createElement('div');
      grid.className = "grid";

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openEditor(p.id);
        card.innerHTML = `
          <h3>${p.title}</h3>
          <div class="card-meta">
            <span>${p.content.split(/\s+/).length} Words</span>
            <span>${new Date(p.updatedAt).toLocaleDateString()}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  // --- BACKUP / RESTORE ---
  function exportData() {
    const blob = new Blob([JSON.stringify(state.projects)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Kheror_Khata_Backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
  }

  function importData(e) {
    const reader = new FileReader();
    reader.onload = (event) => {
      state.projects = JSON.parse(event.target.result);
      saveToDisk();
      renderShelves();
    };
    reader.readAsText(e.target.files[0]);
  }

  // --- PWA SETUP ---
  (function initPWA() {
    const manifest = {
      name: "Golpoboliyer Kheror Khata",
      short_name: "খেরোর খাতা",
      start_url: "./",
      display: "standalone",
      background_color: "#0B0906",
      theme_color: "#0B0906",
      icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B0906'/><text y='50%' x='50%' dominant-baseline='middle' text-anchor='middle' font-size='60' fill='%23C9A84C'>গ</text></svg>", sizes: "512x512", type: "image/svg+xml" }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    if ('serviceWorker' in navigator) {
      const sw = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
      const swBlob = new Blob([sw], {type:'text/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob));
    }
  })();

  // Listeners
  document.getElementById('edit-title').oninput = handleInput;
  document.getElementById('edit-content').oninput = handleInput;
  
  // Boot
  renderShelves();
  updateStats();
</script>
</body>
</html>
